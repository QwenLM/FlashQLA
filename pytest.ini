[pytest]
testpaths = tests
markers =
    gpu: tests that require a CUDA GPU (deselect with '-m "not gpu"')
    hopper: tests that require SM90 (Hopper) GPU
    blackwell: tests that require SM100 (Blackwell) GPU
    sm120: tests that require SM120 (Blackwell) GPU
    slow: tests that take more than 30 seconds
addopts = -v --tb=short
